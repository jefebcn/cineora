services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cineora
      POSTGRES_USER: cineora
      POSTGRES_PASSWORD: cineora_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cineora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineora -d cineora"]
      interval: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - cineora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 12
volumes:
  cineora_pg:
  cineora_redis:
